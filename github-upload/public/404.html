<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wealth Management Product Hub</title>
    <script>
      /* GitHub Pages has no server-side rewrites: a direct hit on a client-side
         route (e.g. /products/fixed-income) returns this 404 page.
         Fold the requested path into a query string and bounce to the SPA
         entry point so the router can resolve it on load.

         Works for a project site (/wealth-management-product-hub/products/...)
         and for a root-domain site (used by other hosts in the same build). */
      ;(function () {
        var REPO = 'wealth-management-product-hub'
        var segments = window.location.pathname.split('/').filter(Boolean)

        /* Strip the repository prefix when present. */
        if (segments[0] === REPO) segments.shift()

        var prefix = '/' + REPO + '/' // project site serves the app from /<repo>/
        if (window.location.pathname.indexOf(prefix) !== 0) prefix = '/'

        var route = segments.join('/')
        var search = window.location.search
          ? '&' + window.location.search.slice(1)
          : ''

        window.location.replace(
          window.location.origin +
            prefix +
            '?p=/' +
            encodeURIComponent(route) +
            search +
            window.location.hash,
        )
      })()
    </script>
  </head>
  <body></body>
</html>
